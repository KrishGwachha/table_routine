<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marksheet</title>
    <link rel="stylesheet" href="routine.css">
</head>
<body>
    <table border="1" cellspacing="0">
        <colgroup>
            <col style="background-color: rgb(255, 202, 202);" span="2">
            <col style="background-color: rgb(214, 255, 225);" span="3">
            <col style="background-color: lightcyan;">
        </colgroup>
        <thead>
            <tr>
                <th colspan="2" class="detail">Student details</th>
                <th colspan="3" class="marks">Subject marks (out of 100)</th>
                <th rowspan="2" class="total">Total</th>
            </tr>
            <tr>
                <th>Roll no.</th>
                <th>Name</th>
                <th>Html</th>
                <th>css</th>
                <th>Java script</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Asha</td>
                <td>88</td>
                <td>84</td>
                <td>90</td>
                <td>262</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Bikash</td>
                <td>75</td>
                <td>80</td>
                <td>78</td>
                <td>233</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Nisha</td>
                <td>92</td>
                <td>89</td>
                <td>94</td>
                <td>275</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Suman</td>
                <td>68</td>
                <td>72</td>
                <td>70</td>
                <td>210</td>
            </tr>
            <tr>
                <td colspan="5">class average (out of 300)</td>
                <td>245</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
